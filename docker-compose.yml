version: '3.8'

services:
  paper:
    image: itzg/minecraft-server:latest
    container_name: paper-server
    ports:
      - "25565:25565"                           # Game Server
      - "19132:19132/udp"                       # Bedrock Server
      - "8100:8100"                             # Web UI (BlueMap)
      - "8804:8804"                             # Web UI (Plan)
    environment:
      EULA: "TRUE"                              # 同意済みなら TRUE
      TYPE: "PAPER"                             # PaperMC を使う
      VERSION: "1.21.4"                         # お好みのバージョンに置き換え
      MEMORY: "2G"                              # JVM に割り当てるメモリ
    volumes:
      - ./data:/data                            # 各種設定・ワールドデータ
      - ./plugins:/data/plugins                 # プラグイン置き場
    restart: always
