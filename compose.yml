# mc-stack — a Velocity proxy + Paper backend network, as Docker Compose.
#
# Topology:
#   player ──(25565)──> proxy (Velocity) ──internal net──> lobby / survival / creative (Paper)
#
# Rules baked in:
#   - Only `proxy` publishes a host port. Backends are reachable ONLY on the
#     internal `mc` network, so nobody can connect to an offline-mode backend
#     directly and spoof a username.
#   - Every backend runs ONLINE_MODE=FALSE (the proxy authenticates players).
#   - One shared forwarding secret (./secrets/forwarding.secret) is mounted into
#     the proxy AND every backend as a Docker secret.
#   - Each backend's /data is bind-mounted to ./servers/<name>/data (gitignored)
#     so worlds, configs, plugins and logs are inspectable on the host.
#   - Site-specific values (version, operators, MOTD, plugins, RCON startup
#     commands) are tuned in .env; this file holds structure and safe defaults.
#
# First run:
#   make secret      # generate ./secrets/forwarding.secret  (once)
#   make setup       # materialize per-server config + .env from *.example templates
#   make up
name: mc-stack

# ── Environment shared by every Paper backend ────────────────────────────────
x-paper-env: &paper-env
  EULA: "TRUE"
  TYPE: "PAPER"
  VERSION: "${MC_VERSION:-LATEST}"
  USE_AIKAR_FLAGS: "TRUE"
  TZ: "${TZ:-UTC}"
  OPS: "${OPS:-}"

  # The proxy handles auth, so backends MUST be offline-mode.
  ONLINE_MODE: "FALSE"

  # itzg reads CFG_FORWARDING_SECRET_FILE into CFG_FORWARDING_SECRET and expands
  # ${CFG_FORWARDING_SECRET} while syncing paper-global.yml from /config into
  # /data/config. The interpolation prefix defaults to "CFG_" — keep it.
  CFG_FORWARDING_SECRET_FILE: "/run/secrets/forwarding_secret"
  REPLACE_ENV_VARIABLES: "TRUE"
  REPLACE_ENV_DURING_SYNC: "TRUE"

  # RCON is reachable only on the internal `mc` network (no port is published),
  # but still needs a password so the backup sidecars can pause/resume saves.
  RCON_PASSWORD_FILE: "/run/secrets/rcon_password"

  # Comma-separated Modrinth slugs, resolved against TYPE+VERSION at boot;
  # removing one has itzg delete it. Plugin notes live in .env.example.
  MODRINTH_PROJECTS: "${PAPER_MODRINTH_PROJECTS:-fastasyncworldedit,axiom-paper-plugin}"

# ── Service skeleton shared by every Paper backend ───────────────────────────
x-paper-common: &paper-common
  # Minecraft 26.1+ requires Java 25; drop to `java21` only when pinning 1.21.x.
  image: itzg/minecraft-server:java25
  restart: unless-stopped
  networks: [mc]
  secrets: [forwarding_secret, rcon_password]
  environment: *paper-env

# ── Superflat world shared by lobby + creative ───────────────────────────────
# bedrock + 59 stone + 3 dirt + 1 grass = 64 layers: bedrock at y=-64, surface
# at y=0. Baked in at first world-gen, so it is set now rather than tuned later.
x-flat-world: &flat-world
  LEVEL_TYPE: "FLAT"
  GENERATOR_SETTINGS: '{"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":59},{"block":"minecraft:dirt","height":3},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}'

# ── Environment shared by every backup sidecar ───────────────────────────────
x-backup-env: &backup-env
  BACKUP_INTERVAL: "${BACKUP_INTERVAL:-24h}"
  PRUNE_BACKUPS_DAYS: "${PRUNE_BACKUPS_DAYS:-7}"
  RCON_PASSWORD_FILE: "/run/secrets/rcon_password"
  TZ: "${TZ:-UTC}"

# ── Service skeleton shared by every backup sidecar ──────────────────────────
x-backup-common: &backup-common
  image: itzg/mc-backup
  restart: unless-stopped
  networks: [mc]
  secrets: [rcon_password]

services:
  # ── Velocity proxy: the only thing exposed to players ─────────────────────
  proxy:
    image: itzg/mc-proxy:latest
    restart: unless-stopped
    networks: [mc]
    ports:
      - "25565:25565" # the ONLY published port on the whole stack
    environment:
      TYPE: "VELOCITY"
      VELOCITY_VERSION: "LATEST"
      TZ: "${TZ:-UTC}"
      MEMORY: "512M" # Velocity is tiny; it does no world simulation

      # Via* protocol translation lives ONLY on the proxy — adding it to a
      # backend as well breaks joins with version mismatches. mc-proxy can't
      # pull from Modrinth, so these are Spiget resource IDs (auto-latest):
      # ViaVersion=19254, ViaBackwards=27448.
      SPIGET_PLUGINS: "${PROXY_SPIGET_PLUGINS:-19254,27448}"

      # itzg copies /config/velocity.toml into /server and expands ${CFG_*}
      # there; velocity.toml references ${CFG_MOTD}. The CFG_ prefix is mandatory.
      REPLACE_ENV_VARIABLES: "TRUE"
      CFG_MOTD: "${PROXY_MOTD:-A Minecraft Server}"
    volumes:
      - ./proxy/velocity.toml:/config/velocity.toml:ro
      - proxy_data:/server
    secrets: [forwarding_secret]
    depends_on: [lobby, survival, creative]

  # ── Paper backends ─────────────────────────────────────────────────────────
  lobby:
    <<: *paper-common
    environment:
      <<: [*paper-env, *flat-world]
      MEMORY: "2G"
      MOTD: "Lobby"
      DIFFICULTY: "peaceful"
      MODE: "adventure"
      GENERATE_STRUCTURES: "false"
      # Hub behaviour at startup: mob spawning off, frozen day/weather, spawn
      # at 0,0,0. Commands live in .env — ${VAR:-…} can't hold multi-line
      # defaults, and empty/unset makes itzg skip the RCON startup loop.
      RCON_CMDS_STARTUP: "${LOBBY_RCON_CMDS_STARTUP:-}"
    volumes:
      - ./servers/lobby/data:/data
      - ./servers/lobby/config/paper-global.yml:/config/paper-global.yml:ro

  survival:
    <<: *paper-common
    environment:
      <<: *paper-env
      MEMORY: "4G"
      MOTD: "Survival"
      DIFFICULTY: "normal"
    volumes:
      - ./servers/survival/data:/data
      - ./servers/survival/config/paper-global.yml:/config/paper-global.yml:ro

  creative:
    <<: *paper-common
    environment:
      <<: [*paper-env, *flat-world]
      MEMORY: "4G"
      MOTD: "Creative"
      MODE: "creative"
      # Superflat like the lobby; pin the spawn to the surface at 0,0,0 (.env).
      RCON_CMDS_STARTUP: "${CREATIVE_RCON_CMDS_STARTUP:-}"
    volumes:
      - ./servers/creative/data:/data
      - ./servers/creative/config/paper-global.yml:/config/paper-global.yml:ro

  # ── Backup sidecars: one per backend ───────────────────────────────────────
  # Each pauses saves over RCON (save-off), tars /data to ./backups/<name>,
  # then re-enables saves (save-all/save-on). Interval + retention come from
  # .env (BACKUP_INTERVAL, PRUNE_BACKUPS_DAYS); no ports are published.
  backup-lobby:
    <<: *backup-common
    environment:
      <<: *backup-env
      RCON_HOST: "lobby"
    volumes:
      - ./servers/lobby/data:/data:ro   # tar reads the world; never writes
      - ./backups/lobby:/backups
    depends_on: [lobby]

  backup-survival:
    <<: *backup-common
    environment:
      <<: *backup-env
      RCON_HOST: "survival"
    volumes:
      - ./servers/survival/data:/data:ro   # tar reads the world; never writes
      - ./backups/survival:/backups
    depends_on: [survival]

  backup-creative:
    <<: *backup-common
    environment:
      <<: *backup-env
      RCON_HOST: "creative"
    volumes:
      - ./servers/creative/data:/data:ro   # tar reads the world; never writes
      - ./backups/creative:/backups
    depends_on: [creative]

networks:
  mc:
    driver: bridge # services resolve each other by name (lobby, survival, ...)

volumes:
  proxy_data:

secrets:
  forwarding_secret:
    file: ./secrets/forwarding.secret # gitignored; created by `make secret`
  rcon_password:
    file: ./secrets/rcon.secret # gitignored; created by `make secret`
