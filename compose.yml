# mc-ops-stack — a Velocity proxy + Paper backend network, as Docker Compose.
#
# Topology:
#   player ──(25565)──> proxy (Velocity) ──internal net──> lobby / survival / creative (Paper)
#
# Rules baked in:
#   - Only `proxy` publishes a host port. Backends are reachable ONLY on the
#     internal `mc` network, so nobody can connect to an offline-mode backend
#     directly and spoof a username.
#   - Every backend runs ONLINE_MODE=FALSE (the proxy authenticates players).
#   - One shared forwarding secret (./secrets/forwarding.secret) is mounted into
#     the proxy AND every backend as a Docker secret. A second shared secret
#     (./secrets/rcon.secret) is the backends' RCON password — RCON stays
#     internal-network-only; it exists so the backup sidecars can pause saves.
#   - Each backend's /data is bind-mounted to ./servers/<name>/data (gitignored)
#     so worlds, configs and logs are inspectable on the host. /data/plugins is
#     additionally bind-mounted to its own ./servers/<name>/plugins (gitignored)
#     since plugin jars/configs get touched far more often than the rest of
#     /data — a stable, top-level path beats digging through world/log churn.
#   - One backup sidecar per backend mounts that /data read-only, publishes no
#     ports, and archives to ./backups/<name> (gitignored).
#   - Site-specific values (version, operators, MOTD, plugins, RCON startup
#     commands) are tuned in .env; this file holds structure and safe defaults.
#
# First run:
#   make secret      # generate ./secrets/{forwarding,rcon}.secret  (once)
#   make setup       # copy .env from .env.example
#   make up
name: mc-ops-stack

# ── Environment shared by every Paper backend ────────────────────────────────
x-paper-env: &paper-env
  EULA: "TRUE"
  TYPE: "PAPER"
  VERSION: "${MC_VERSION:-LATEST}"
  USE_AIKAR_FLAGS: "TRUE"
  TZ: "${TZ:-UTC}"
  OPS: "${OPS:-}"

  # The proxy handles auth, so backends MUST be offline-mode.
  ONLINE_MODE: "FALSE"

  # itzg reads CFG_FORWARDING_SECRET_FILE into CFG_FORWARDING_SECRET and expands
  # ${CFG_FORWARDING_SECRET} while syncing paper-global.yml from /config into
  # /data/config. The interpolation prefix defaults to "CFG_" — keep it.
  CFG_FORWARDING_SECRET_FILE: "/run/secrets/forwarding_secret"
  REPLACE_ENV_VARIABLES: "TRUE"
  REPLACE_ENV_DURING_SYNC: "TRUE"

  # RCON is reachable only on the internal `mc` network (no port is published),
  # but still needs a password so the backup sidecars can pause/resume saves.
  RCON_PASSWORD_FILE: "/run/secrets/rcon_password"

# ── Log rotation shared by every service ─────────────────────────────────────
# Minecraft servers log heavily; the json-file driver is unbounded by
# default and will eat the disk over months of uptime.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# ── Service skeleton shared by every Paper backend ───────────────────────────
x-paper-common: &paper-common
  # Minecraft 26.1+ requires Java 25; drop to a `*-java21` tag only when
  # pinning 1.21.x. Pinned to the latest verified stable release (2026-07-04);
  # Dependabot (.github/dependabot.yml) opens a PR when itzg cuts a new one.
  image: itzg/minecraft-server:2026.9.0-java25
  restart: unless-stopped
  # Compose kills after 10s by default; Paper needs time to flush world
  # saves on shutdown or worlds can corrupt.
  stop_grace_period: 1m
  networks: [mc]
  secrets: [forwarding_secret, rcon_password]
  environment: *paper-env
  logging: *logging

# ── Superflat world shared by lobby + creative ───────────────────────────────
# bedrock + 59 stone + 3 dirt + 1 grass = 64 layers: bedrock at y=-64, surface
# at y=0. Baked in at first world-gen, so it is set now rather than tuned later.
x-flat-world: &flat-world
  LEVEL_TYPE: "FLAT"
  GENERATOR_SETTINGS: '{"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":59},{"block":"minecraft:dirt","height":3},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}'

# ── Environment shared by every backup sidecar ───────────────────────────────
x-backup-env: &backup-env
  BACKUP_INTERVAL: "${BACKUP_INTERVAL:-24h}"
  PRUNE_BACKUPS_DAYS: "${PRUNE_BACKUPS_DAYS:-7}"
  RCON_PASSWORD_FILE: "/run/secrets/rcon_password"
  TZ: "${TZ:-UTC}"

# ── Service skeleton shared by every backup sidecar ──────────────────────────
x-backup-common: &backup-common
  # Pinned to the latest verified stable release (2026-07-04); see
  # x-paper-common above for the Dependabot note.
  image: itzg/mc-backup:2026.6.2
  restart: unless-stopped
  networks: [mc]
  secrets: [rcon_password]
  logging: *logging

services:
  # ── Velocity proxy: the only thing exposed to players ─────────────────────
  proxy:
    # Latest verified versioned release (itzg cuts these less often than
    # Velocity itself; see .github/dependabot.yml for future bumps).
    image: itzg/mc-proxy:2025.10.0-java25
    restart: unless-stopped
    networks: [mc]
    ports:
      - "25565:25565" # the ONLY published port on the whole stack
    environment:
      TYPE: "VELOCITY"
      # Velocity ships x.y.z-SNAPSHOT version lines; itzg's finest-grained pin
      # here is the version string — the build within it still floats
      # (VELOCITY_BUILD_ID defaults to "latest").
      VELOCITY_VERSION: "3.5.0-SNAPSHOT"
      TZ: "${TZ:-UTC}"
      MEMORY: "512M" # Velocity is tiny; it does no world simulation

      # Via* protocol translation lives ONLY on the proxy — adding it to a
      # backend as well breaks joins with version mismatches. ViaBackwards'
      # Spiget listing is "external" (hosted on Hangar, not SpigotMC's CDN),
      # so Spiget's /download redirects to an HTML page instead of the jar
      # and itzg's unzip fails; Modrinth publishes velocity-loader builds of
      # both plugins directly, so use that instead. Needs MINECRAFT_VERSION
      # (not MC_VERSION) — that's the exact env var mc-proxy's Modrinth path reads.
      MINECRAFT_VERSION: "${MC_VERSION:-LATEST}"
      MODRINTH_PROJECTS: "${PROXY_MODRINTH_PROJECTS:-viaversion,viabackwards}"
      # proxy_data is a named volume, so plugin jars survive container
      # recreation — without this, changing MODRINTH_PROJECTS leaves old jars
      # behind and Velocity refuses to load a duplicate plugin ID. Safe here
      # since nothing is ever manually dropped into the proxy's plugins dir
      # (unlike the backends' bind-mounted ./servers/<name>/plugins).
      REMOVE_OLD_PLUGINS: "TRUE"

      # itzg copies /config/velocity.toml into /server and expands ${CFG_*}
      # there; velocity.toml references ${CFG_MOTD}. The CFG_ prefix is mandatory.
      REPLACE_ENV_VARIABLES: "TRUE"
      CFG_MOTD: "${PROXY_MOTD:-A Minecraft Server}"
    volumes:
      - ./proxy/velocity.toml:/config/velocity.toml:ro
      - proxy_data:/server
    secrets: [forwarding_secret]
    depends_on: [lobby, survival, creative]
    logging: *logging

  # ── Paper backends ─────────────────────────────────────────────────────────
  lobby:
    <<: *paper-common
    environment:
      <<: [*paper-env, *flat-world]
      MEMORY: "2G"
      MOTD: "Lobby"
      DIFFICULTY: "peaceful"
      MODE: "adventure"
      GENERATE_STRUCTURES: "false"
      # Hub behaviour at startup: mob spawning off, frozen day/weather, spawn
      # at 0,0,0. Commands live in .env — ${VAR:-…} can't hold multi-line
      # defaults, and empty/unset makes itzg skip the RCON startup loop.
      RCON_CMDS_STARTUP: "${LOBBY_RCON_CMDS_STARTUP:-}"
      # Plugins on this backend only — Modrinth slugs; notes live in .env.example.
      MODRINTH_PROJECTS: "${LOBBY_MODRINTH_PROJECTS:-}"
    volumes:
      - ./servers/lobby/data:/data
      - ./servers/lobby/plugins:/data/plugins
      - ./paper/paper-global.yml:/config/paper-global.yml:ro

  survival:
    <<: *paper-common
    environment:
      <<: *paper-env
      MEMORY: "4G"
      MOTD: "Survival"
      DIFFICULTY: "normal"
      # Plugins on this backend only — Modrinth slugs; notes live in .env.example.
      MODRINTH_PROJECTS: "${SURVIVAL_MODRINTH_PROJECTS:-}"
    volumes:
      - ./servers/survival/data:/data
      - ./servers/survival/plugins:/data/plugins
      - ./paper/paper-global.yml:/config/paper-global.yml:ro

  creative:
    <<: *paper-common
    environment:
      <<: [*paper-env, *flat-world]
      MEMORY: "4G"
      MOTD: "Creative"
      MODE: "creative"
      # Superflat like the lobby; pin the spawn to the surface at 0,0,0 (.env).
      RCON_CMDS_STARTUP: "${CREATIVE_RCON_CMDS_STARTUP:-}"
      # Plugins on this backend only — building tools live here, not network-wide.
      MODRINTH_PROJECTS: "${CREATIVE_MODRINTH_PROJECTS:-fastasyncworldedit,axiom-paper-plugin}"
    volumes:
      - ./servers/creative/data:/data
      - ./servers/creative/plugins:/data/plugins
      - ./paper/paper-global.yml:/config/paper-global.yml:ro

  # ── Backup sidecars: one per backend ───────────────────────────────────────
  # Each pauses saves over RCON (save-off), flushes with save-all, tars /data
  # to ./backups/<name>, then re-enables saves (save-on). Interval + retention
  # come from .env (BACKUP_INTERVAL, PRUNE_BACKUPS_DAYS); no ports published.
  backup-lobby:
    <<: *backup-common
    environment:
      <<: *backup-env
      RCON_HOST: "lobby"
    volumes:
      - ./servers/lobby/data:/data:ro   # tar reads the world; never writes
      - ./servers/lobby/plugins:/data/plugins:ro   # plugins live outside data/; include in the tar too
      - ./backups/lobby:/backups
    depends_on: [lobby]

  backup-survival:
    <<: *backup-common
    environment:
      <<: *backup-env
      RCON_HOST: "survival"
    volumes:
      - ./servers/survival/data:/data:ro   # tar reads the world; never writes
      - ./servers/survival/plugins:/data/plugins:ro   # plugins live outside data/; include in the tar too
      - ./backups/survival:/backups
    depends_on: [survival]

  backup-creative:
    <<: *backup-common
    environment:
      <<: *backup-env
      RCON_HOST: "creative"
    volumes:
      - ./servers/creative/data:/data:ro   # tar reads the world; never writes
      - ./servers/creative/plugins:/data/plugins:ro   # plugins live outside data/; include in the tar too
      - ./backups/creative:/backups
    depends_on: [creative]

networks:
  mc:
    driver: bridge # services resolve each other by name (lobby, survival, ...)

volumes:
  proxy_data:

secrets:
  forwarding_secret:
    file: ./secrets/forwarding.secret # gitignored; created by `make secret`
  rcon_password:
    file: ./secrets/rcon.secret # gitignored; created by `make secret`
