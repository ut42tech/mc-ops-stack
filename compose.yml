# mc-stack — a Velocity proxy + Paper backend network, as Docker Compose.
#
# Topology:
#   player ──(25565)──> proxy (Velocity) ──internal net──> lobby / survival / creative (Paper)
#
# Rules baked in:
#   - Only `proxy` publishes a host port. Backends are reachable ONLY on the
#     internal `mc` network, so nobody can connect to an offline-mode backend
#     directly and spoof a username.
#   - Every backend runs ONLINE_MODE=FALSE (the proxy authenticates players).
#   - One shared forwarding secret (./secrets/forwarding.secret) is mounted into
#     the proxy AND every backend as a Docker secret.
#   - Each backend's /data is bind-mounted to ./servers/<name>/data (gitignored)
#     so worlds, configs, plugins and logs are inspectable on the host.
#
# First run:
#   make secret      # generate ./secrets/forwarding.secret  (once)
#   make setup       # materialize per-server config + .env from *.example templates
#   make up
name: mc-stack

# ── Shared Paper backend definition (DRY) ───────────────────────────────────
x-paper-common:
  &paper-common # Minecraft 26.1+ requires Java 25; drop to `java21` only if you pin a 1.21.x MC_VERSION.
  image: itzg/minecraft-server:java25
  restart: unless-stopped
  networks: [mc]
  secrets:
    - forwarding_secret
  environment: &paper-env
    EULA: "TRUE"
    TYPE: "PAPER"
    VERSION: "${MC_VERSION:-LATEST}"
    USE_AIKAR_FLAGS: "TRUE"
    TZ: "${TZ:-UTC}"
    OPS: "${OPS:-}"
    # The proxy handles auth, so backends MUST be offline-mode.
    ONLINE_MODE: "FALSE"
    # itzg reads CFG_FORWARDING_SECRET_FILE into CFG_FORWARDING_SECRET and substitutes
    # ${CFG_FORWARDING_SECRET} while paper-global.yml syncs from /config into /data/config.
    # The interpolation prefix defaults to "CFG_", so the variable MUST be CFG_-prefixed.
    CFG_FORWARDING_SECRET_FILE: "/run/secrets/forwarding_secret"
    REPLACE_ENV_VARIABLES: "TRUE"
    REPLACE_ENV_DURING_SYNC: "TRUE"
    # Admin worldedit tooling on EVERY backend: auto-downloaded from Modrinth at boot,
    # matched to TYPE=PAPER + VERSION; remove a line to have itzg delete that plugin.
    # - fastasyncworldedit bundles WorldEdit (needs Java 21+, satisfied by java25).
    # - axiom-paper-plugin is only the serverside half: players also need the Axiom
    #   CLIENT mod + op/axiom.default perm, and MULTIPLAYER USE REQUIRES a commercial
    #   license or a whitelist from the Axiom Discord.
    MODRINTH_PROJECTS: |
      fastasyncworldedit
      axiom-paper-plugin

# ── Shared superflat world (lobby + creative) ───────────────────────────────
# bedrock + 59 stone + 3 dirt + 1 grass = 64 layers: bedrock at y=-64, surface at y=0.
# Baked in at first world-gen, so it is set now rather than tuned later.
x-flat-world: &flat-world
  LEVEL_TYPE: "FLAT"
  GENERATOR_SETTINGS: '{"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":59},{"block":"minecraft:dirt","height":3},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}'

services:
  # ── Velocity proxy: the only thing exposed to players ─────────────────────
  proxy:
    image: itzg/mc-proxy:latest
    restart: unless-stopped
    networks: [mc]
    ports:
      - "25565:25565" # <-- the ONLY published port on the whole stack
    environment:
      TYPE: "VELOCITY"
      VELOCITY_VERSION: "LATEST"
      TZ: "${TZ:-UTC}"
      MEMORY: "512M" # Velocity is tiny; it does no world simulation
      # Network-wide protocol translation lives ONLY on the proxy — Via* must be on
      # exactly one layer, never also on a backend, or joins break with version
      # mismatches. mc-proxy can't pull from Modrinth, so use Spiget resource IDs
      # (auto-latest): ViaVersion=19254, ViaBackwards=27448.
      SPIGET_PLUGINS: "19254,27448"
    volumes:
      - ./proxy/velocity.toml:/config/velocity.toml:ro
      - proxy_data:/server
    secrets:
      - forwarding_secret
    depends_on:
      - lobby
      - survival
      - creative

  # ── Backends ──────────────────────────────────────────────────────────────
  lobby:
    <<: *paper-common
    environment:
      <<: [*paper-env, *flat-world]
      MEMORY: "2G"
      MOTD: "Lobby"
      DIFFICULTY: "peaceful"
      MODE: "adventure"
      GENERATE_STRUCTURES: "false"
      # Hub behaviour, applied once the server is up: no mob spawning, frozen
      # daytime and clear weather, and spawn on the surface at 0,0,0.
      RCON_CMDS_STARTUP: |-
        gamerule doMobSpawning false
        gamerule doDaylightCycle false
        gamerule doWeatherCycle false
        time set day
        weather clear
        setworldspawn 0 0 0
    volumes:
      - ./servers/lobby/data:/data
      - ./servers/lobby/config/paper-global.yml:/config/paper-global.yml:ro

  survival:
    <<: *paper-common
    environment:
      <<: *paper-env
      MEMORY: "4G"
      MOTD: "Survival"
      DIFFICULTY: "normal"
    volumes:
      - ./servers/survival/data:/data
      - ./servers/survival/config/paper-global.yml:/config/paper-global.yml:ro

  creative:
    <<: *paper-common
    environment:
      <<: [*paper-env, *flat-world]
      MEMORY: "4G"
      MOTD: "Creative"
      MODE: "creative"
      # Superflat like the lobby; pin the spawn to the surface at 0,0,0.
      RCON_CMDS_STARTUP: |-
        setworldspawn 0 0 0
    volumes:
      - ./servers/creative/data:/data
      - ./servers/creative/config/paper-global.yml:/config/paper-global.yml:ro

networks:
  mc:
    driver: bridge # services resolve each other by name (lobby, survival, ...)

volumes:
  proxy_data:

secrets:
  forwarding_secret:
    file: ./secrets/forwarding.secret # gitignored; created by `make secret`
